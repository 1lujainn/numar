<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نُعمِّر — من التصميم إلى الهوية</title>
<meta name="description" content="نُعمِّر: اكتشف الطراز المعماري لمنطقتك، وافحص توافق تصميمك مع الطرز المعمارية السعودية.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/a054cb949b7254ccd76d690a750109d7.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F1EA;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;color:#221B16}
a{color:#68100F}a:hover{color:#8A6440}
.nm-cq{container-type:inline-size;container-name:app}
.nm-app{background:#F5F1EA;color:#221B16;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
.nm-app *{box-sizing:border-box}
:where(.nm-app) button{font-family:inherit;cursor:pointer;color:inherit}
.nm-app img{display:block}
.disp{font-family:Alexandria,'IBM Plex Sans Arabic',sans-serif;font-weight:700}
.wrap{padding-inline:64px}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.02em;color:#68100F;display:flex;gap:12px;align-items:center}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor;display:block}
.muted{color:#62584D}
.rule{border-top:1px solid #D8CDBC}
.btn{display:inline-flex;align-items:center;gap:14px;min-height:52px;padding:0 30px;background:#02564D;color:#FFFFFF;border:0;border-radius:12px;font-size:16px;font-weight:600;text-decoration:none;transition:background .35s}
.btn:hover{background:#013F38;color:#FFFFFF}
.btn.sand{background:#CBBA9E;color:#3A0908}.btn.sand:hover{background:#DCCDB3}
.btn.ghost{background:transparent;color:#221B16;border:1px solid #221B16}.btn.ghost:hover{background:#221B16;color:#F5F1EA}
.btn[disabled]{background:#CFC5B5;color:#62584D;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;font-size:15px;font-weight:500;color:#221B16;border-bottom:1px solid #221B16;text-decoration:none}
.link:hover{color:#68100F;border-color:#68100F}
.nm-app button:focus-visible,.nm-app a:focus-visible,.nm-app label:focus-visible{outline:2px solid #68100F;outline-offset:3px}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(245,241,234,.94);backdrop-filter:blur(6px);border-bottom:1px solid #D8CDBC}
.hdr-in{height:78px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
.hdr-in>.brand{justify-self:start}
.hdr-in>.nav{justify-self:center}
.hdr-in>.menu-btn{justify-self:end}
.brand{display:flex;align-items:baseline;gap:12px;background:none;border:0;padding:0}
.logo{height:52px;width:auto;display:block}
.wm-logo{height:72px;width:auto;display:block}
.brand b{font-family:Amiri,serif;font-weight:700;font-size:38px;line-height:1;color:#221B16}
.brand span{font-size:12px;color:#62584D}
.nav{display:flex;gap:38px}
.nav button{background:none;border:0;padding:8px 0;font-size:15px;font-weight:500;border-bottom:1px solid transparent}
.nav button.on{color:#68100F;border-color:#68100F}
.nav button:hover{color:#68100F}
.menu-btn{display:none;background:none;border:1px solid #221B16;width:44px;height:44px;align-items:center;justify-content:center}
.mnav{display:none}

/* motion */
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes drift{from{transform:scale(1.02) translate3d(0,0,0)}to{transform:scale(1.1) translate3d(-1.5%,-1%,0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes softpulse{0%,100%{box-shadow:0 0 0 0 rgba(203,186,158,.0)}50%{box-shadow:0 0 0 8px rgba(203,186,158,.28)}}
.page{animation:pageIn .8s cubic-bezier(.2,.7,.1,1) both}
.rise{animation:rise 1s cubic-bezier(.2,.7,.1,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.5s}
.reveal{animation:reveal 1.4s cubic-bezier(.3,.6,.1,1) both}
.drift{animation:drift 22s ease-in-out infinite alternate}
.zoomable{overflow:hidden}
.zoomable img{transition:transform 1.4s cubic-bezier(.2,.7,.1,1)}
.zoomable:hover img{transform:scale(1.05)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;padding-top:56px;padding-bottom:72px;align-items:end}
.hero h1{font-size:92px;line-height:1.05;margin:24px 0 0}
.hero-img{height:620px;overflow:hidden;position:relative;background:#E3D9C8}
.hero-img img{width:100%;height:100%;object-fit:cover}
.cap{font-size:12px;color:#62584D;margin-top:10px;display:flex;justify-content:space-between;gap:16px}
.intro{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:80px;padding-top:110px;padding-bottom:110px;align-items:center}
.intro h2{font-size:58px;line-height:1.2;margin:22px 0 0}
.intro-img{height:640px;overflow:hidden}
.intro-img img{width:100%;height:100%;object-fit:cover}
.process{background:#EDE6DA;padding-top:96px;padding-bottom:104px}
.proc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin-top:56px}
.proc{display:flex;flex-direction:column;gap:18px}
.proc-img{aspect-ratio:3/4;overflow:hidden;position:relative;background:#E3D9C8}
.proc-img img{width:100%;height:100%;object-fit:cover}
.proc h3{font-size:30px;margin:0;display:flex;gap:14px;align-items:baseline}
.proc h3 small{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:13px;color:#68100F;font-weight:500}
.cta-final{position:relative;min-height:620px;display:flex;align-items:flex-end;overflow:hidden;background:#3A2418}
.cta-final>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cta-box{position:relative;background:#68100F;color:#F5F1EA;padding:56px 56px 52px;margin:0 64px 64px auto;width:560px}
.cta-box h2{font-size:54px;line-height:1.2;margin:0 0 28px}

/* archive */
.arch-head{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:64px;padding-top:72px;padding-bottom:40px;align-items:end}
.arch-head h1{font-size:84px;line-height:1.05;margin:20px 0 0}
.filters{display:flex;gap:30px;flex-wrap:wrap;border-bottom:1px solid #D8CDBC;padding-bottom:0}
.filters button{background:none;border:0;border-bottom:2px solid transparent;padding:14px 0;font-size:15px;font-weight:500;color:#62584D}
.filters button.on{color:#68100F;border-color:#68100F}
.filters button:hover{color:#221B16}
.mosaic{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:56px 32px;padding-top:48px;padding-bottom:110px;align-items:start}
.tile{grid-column:span 4;background:none;border:0;padding:0;text-align:right;display:flex;flex-direction:column;gap:14px;animation:rise .9s cubic-bezier(.2,.7,.1,1) both}
.tile.s7{grid-column:span 7}.tile.s5{grid-column:span 5}.tile.s8{grid-column:span 8}.tile.s4{grid-column:span 4}
.tile .ph{position:relative;overflow:hidden;background:#E3D9C8}
.tile.s7 .ph{aspect-ratio:4/3}.tile.s5 .ph{aspect-ratio:4/5}.tile.s4 .ph{aspect-ratio:3/4}.tile.s8 .ph{aspect-ratio:16/9}
.tile.low.s5 .ph{margin-top:120px}
.tile .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.6s cubic-bezier(.2,.7,.1,1)}
.tile:hover .ph img{transform:scale(1.06)}
.tile .veil{position:absolute;inset:auto 0 0 0;padding:22px 24px;background:linear-gradient(to top,rgba(34,27,22,.72),rgba(34,27,22,0));color:#F5F1EA;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;opacity:0;transform:translateY(12px);transition:opacity .6s,transform .6s}
.tile:hover .veil,.tile:focus-visible .veil{opacity:1;transform:none}
.tile .veil span{font-size:13px}
.tile .veil b{font-size:14px;font-weight:600;white-space:nowrap}
.tone{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:26px;color:#F5F1EA}
.tone i{font-style:normal;font-family:Amiri,serif;font-size:64px;line-height:1;opacity:.9}
.tone em{font-style:normal;font-size:12px;opacity:.85}
.tmeta{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.tmeta .n{font-family:Amiri,serif;font-size:18px;color:#68100F}
.tname{font-family:Amiri,serif;font-size:32px;line-height:1.2;margin:0;font-weight:700}
.tsub{font-size:13px;color:#62584D;display:flex;gap:10px;flex-wrap:wrap}
.tdesc{font-size:15px;line-height:1.85;color:#3B332C;margin:0;max-width:520px}
.badge{font-size:12px;font-weight:500;padding:3px 10px;border:1px solid currentColor;white-space:nowrap}

/* style detail */
.sd-hero{position:relative;height:720px;overflow:hidden;background:#3A2418}
.sd-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sd-hero .shade{position:absolute;inset:0;background:linear-gradient(to left,rgba(34,27,22,.78) 0%,rgba(34,27,22,.35) 45%,rgba(34,27,22,0) 70%)}
.sd-hero .txt{position:absolute;right:64px;bottom:72px;width:620px;color:#F5F1EA}
.sd-hero h1{font-size:96px;line-height:1.05;margin:18px 0 18px}
.sd-hero p{font-size:18px;line-height:1.9;margin:0 0 32px;color:#EFE7DA}
.sec{padding-top:100px;padding-bottom:100px}
.sec-h{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:64px;align-items:end;border-bottom:1px solid #221B16;padding-bottom:22px;margin-bottom:56px}
.sec-h h2{font-size:56px;margin:14px 0 0;line-height:1.1}
.sec-h p{margin:0;font-size:16px;line-height:1.9;color:#3B332C;max-width:560px}
.chars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:64px 32px}
.char{display:flex;flex-direction:column;gap:16px}
.char:nth-child(1){grid-column:1 / span 7}.char:nth-child(2){grid-column:9 / span 4;margin-top:140px}
.char:nth-child(3){grid-column:1 / span 4}.char:nth-child(4){grid-column:6 / span 7;margin-top:-60px}
.char .ph{overflow:hidden;background:#E3D9C8}
.char:nth-child(1) .ph{aspect-ratio:4/3}.char:nth-child(2) .ph{aspect-ratio:3/4}.char:nth-child(3) .ph{aspect-ratio:3/4}.char:nth-child(4) .ph{aspect-ratio:16/10}
.char .ph img{width:100%;height:100%;object-fit:cover}
.char h3{font-size:30px;margin:0;display:flex;gap:14px;align-items:baseline}
.char h3 small{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:13px;color:#68100F;font-weight:500}
.char p{margin:0;font-size:16px;line-height:1.9;color:#3B332C;max-width:520px}
.props{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid #D8CDBC}
.prop{padding:40px 36px 36px;border-left:1px solid #D8CDBC;display:flex;flex-direction:column;gap:18px}
.prop:last-child{border-left:0}
.prop .fig{height:220px;display:flex;align-items:flex-end;justify-content:center;gap:12px}
.prop .ratio{font-family:Amiri,serif;font-size:54px;line-height:1;color:#68100F}
.prop h3{font-size:19px;margin:0;font-weight:600}
.prop p{margin:0;font-size:15px;line-height:1.85;color:#3B332C}
.prop .src{font-size:12px;color:#62584D}
.pal{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:56px}
.pal h3{font-size:15px;font-weight:600;margin:0 0 6px;display:flex;gap:10px;align-items:center}
.pal .hint{font-size:13px;color:#62584D;margin:0 0 22px}
.sw-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sw{display:flex;flex-direction:column;gap:10px}
.sw .chip{aspect-ratio:3/4;position:relative;overflow:hidden}
.sw .chip::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.08))}
.sw b{font-size:15px;font-weight:600}
.sw span{font-size:12px;color:#62584D;font-family:'IBM Plex Sans Arabic',sans-serif;direction:ltr;text-align:right}
.elem{background:#221B16;color:#F5F1EA}
.elem-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:64px;align-items:center}
.elem-img{height:720px;overflow:hidden}
.elem-img img{width:100%;height:100%;object-fit:cover}
.elem h2{font-size:72px;margin:18px 0 22px;line-height:1.05}
.elem p{font-size:17px;line-height:1.95;color:#E4D9C8;margin:0 0 18px}
.elem .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:30px}
.elem .pair div{aspect-ratio:1/1;overflow:hidden}
.elem .pair img{width:100%;height:100%;object-fit:cover}
.gallery{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:120px;gap:20px}
.gallery figure{margin:0;overflow:hidden;position:relative;background:#E3D9C8}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform 1.6s cubic-bezier(.2,.7,.1,1)}
.gallery figure:hover img{transform:scale(1.05)}
.gallery figcaption{position:absolute;right:14px;bottom:12px;font-size:12px;color:#F5F1EA;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.g1{grid-column:1 / span 7;grid-row:span 5}.g2{grid-column:8 / span 5;grid-row:span 3}.g3{grid-column:8 / span 5;grid-row:span 2}
.g4{grid-column:1 / span 4;grid-row:span 4}.g5{grid-column:5 / span 4;grid-row:span 4}.g6{grid-column:9 / span 4;grid-row:span 4}
.sources{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:64px;font-size:14px;line-height:1.9;color:#3B332C}
.sources ol{margin:0;padding:0 18px 0 0}
.sources h3{font-size:14px;font-weight:600;margin:0 0 8px;color:#221B16}
.endcta{background:#68100F;color:#F5F1EA;display:flex;justify-content:space-between;align-items:center;gap:32px;padding-top:72px;padding-bottom:72px}
.endcta h2{font-size:54px;margin:0;line-height:1.2}
.pending{border:1px solid #D8CDBC;padding:44px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center;background:#EDE6DA}
.pending h3{font-size:36px;margin:0}
.pending p{margin:0;font-size:16px;line-height:1.9;color:#3B332C}

/* check */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-bottom:1px solid #D8CDBC}
.stp{padding:22px 0 18px;display:flex;gap:14px;align-items:baseline;border-bottom:2px solid transparent;margin-bottom:-1px;color:#8C8173;font-size:15px;font-weight:500}
.stp b{font-family:Alexandria,sans-serif;font-size:18px;font-weight:800}
.stp.on{color:#68100F;border-color:#68100F}
.stp.done{color:#221B16}
.chk-h{padding-top:64px;padding-bottom:36px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:56px;align-items:end}
.chk-h h1{font-size:44px;margin:16px 0 0;line-height:1.25}
.chk-h p{margin:0;font-size:17px;line-height:1.9;color:#3B332C}
.arches{display:flex;gap:18px;overflow-x:auto;padding:12px 2px 26px;scroll-snap-type:x mandatory}
.arch{flex:0 0 190px;scroll-snap-align:start;background:none;border:0;padding:0;text-align:right;display:flex;flex-direction:column;gap:12px}
.arch .aw{height:360px;border-radius:95px 95px 0 0;overflow:hidden;position:relative;background:#E3D9C8;outline:2px solid transparent;outline-offset:6px;transition:outline-color .35s,transform .6s cubic-bezier(.2,.7,.1,1)}
.arch:hover .aw{transform:translateY(-6px)}
.arch.on .aw{outline-color:#02564D}
.arch .aw img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s}
.arch:hover .aw img{transform:scale(1.06)}
.arch .aw .tone i{font-size:40px}
.arch b{font-family:Alexandria,sans-serif;font-size:16px;font-weight:700;line-height:1.4}
.arch span{font-size:12px}
.sel-panel{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:center;border-top:1px solid #221B16;padding-top:36px;margin-top:10px;padding-bottom:96px}
.sel-panel .big{height:420px;overflow:hidden;position:relative;background:#E3D9C8}
.sel-panel .big img{width:100%;height:100%;object-fit:cover}
.sel-panel h2{font-size:34px;margin:12px 0 14px}
.note{font-size:14px;line-height:1.8;padding:14px 18px;background:#EDE6DA;border-right:2px solid #8A6440;color:#3B332C}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:460px;border:1.5px dashed #8A6440;background:#EDE6DA;text-align:center;padding:40px;transition:background .3s,border-color .3s;cursor:pointer}
.drop.over{background:#E3D6C0;border-color:#68100F}
.drop h3{font-family:Alexandria,sans-serif;font-size:26px;margin:0;font-weight:700}
.up-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:56px;padding-bottom:96px;align-items:start}
.preview{position:relative;background:#E9E1D3;height:560px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img{max-width:100%;max-height:100%;object-fit:contain}
.an-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:64px;padding-bottom:110px;align-items:start}
.stage{position:relative;height:720px;background:#E9E1D3;overflow:hidden}
.stage .fr{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);height:100%;aspect-ratio:2/3}
.stage .fr img{width:100%;height:100%;object-fit:contain}
.stage .dim{position:absolute;inset:0;background:rgba(34,27,22,.18);animation:fadein 1s both}
.hl{position:absolute;border-radius:6px;border:1.5px solid rgba(245,241,234,.95);box-shadow:0 0 0 1px rgba(104,16,15,.35);animation:fadein .8s both,softpulse 2.6s ease-in-out infinite}
.hl.warn{border-color:#E7B98A}
.hl .tag{position:absolute;top:-34px;right:-2px;white-space:nowrap;font-size:12px;font-weight:500;background:#F5F1EA;color:#221B16;padding:5px 10px;border-radius:2px;animation:rise .7s both}
.hl.warn .tag{background:#F3DFC8}
.dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:13px;border:2px solid #F5F1EA;box-shadow:0 2px 10px rgba(0,0,0,.25);animation:fadein .6s both}
.an-list{display:flex;flex-direction:column}
.an-item{display:grid;grid-template-columns:40px 1fr auto;gap:16px;align-items:center;padding:22px 0;border-bottom:1px solid #D8CDBC;color:#8C8173;transition:color .5s}
.an-item.on{color:#221B16}
.an-item.done{color:#221B16}
.an-item .num{font-family:Amiri,serif;font-size:24px}
.an-item b{font-size:18px;font-weight:600;display:block}
.an-item small{font-size:13px;color:#62584D}
.an-item .st{font-size:12px;font-weight:500}
.bar{height:2px;background:#D8CDBC;position:relative;overflow:hidden;margin-top:26px}
.bar i{position:absolute;right:0;top:0;bottom:0;background:#68100F;transition:width 1.1s linear}

/* result */
.res-top{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:end;padding-top:64px;padding-bottom:56px;border-bottom:1px solid #221B16}
.pct{font-family:Alexandria,sans-serif;font-weight:800;font-size:120px;line-height:.9;color:#68100F;display:flex;align-items:flex-start;gap:6px}
.pct small{font-size:52px;line-height:1.4}
.res-top h1{font-size:40px;margin:14px 0 10px}
.res-top p{margin:0;font-size:16px;line-height:1.9;color:#3B332C;max-width:560px}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px;font-size:13px;color:#62584D}
.facts b{color:#221B16;font-weight:600}
.method{padding-top:44px;padding-bottom:12px}
.wbar{display:flex;height:64px;gap:3px;margin-top:18px}
.wseg{position:relative;background:#E3D9C8;overflow:hidden}
.wseg i{position:absolute;right:0;top:0;bottom:0;background:#8A6440;transition:width 1.4s cubic-bezier(.2,.7,.1,1)}
.wseg.c2 i{background:#68100F}.wseg.c3 i{background:#6B6A48}.wseg.c4 i{background:#A9674A}
.wseg span{position:absolute;right:12px;top:10px;font-size:12px;color:#F5F1EA;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.25)}
.wlab{display:flex;gap:3px;margin-top:10px;font-size:13px}
.wlab div{display:flex;flex-direction:column;gap:2px}

<header class="hdr">
<div class="hdr-in wrap">
<button class="brand" @click="goHome" aria-label="نُعمِّر — الرئيسية"><img class="logo" src="assets/a054cb949b7254ccd76d690a750109d7.png" alt="نُعمِّر Numar"></button>
<nav class="nav" aria-label="القائمة الرئيسية">
<button :class="navCls.home" @click="goHome">الرئيسية</button>
<button :class="navCls.styles" @click="goStyles">الطرز</button>
<button :class="navCls.about" @click="goAbout">عن نُعمِّر</button>
</nav>
<button class="menu-btn" @click="toggleMenu" aria-label="القائمة" :aria-expanded="menuOpen"><svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path d="M0 1h20M0 7h20M0 13h20" stroke="#221B16" stroke-width="1.5"/></svg></button>
</div>
<template v-if="menu">
<div class="mnav">
<button @click="goHome">الرئيسية</button>
<button @click="goStyles">الطرز</button>
<button @click="goAbout">عن نُعمِّر</button>
</div>
</template>
</header>

<!-- ===================== HOME ===================== -->
<template v-if="P.home">
<main class="page">
<section class="h-hero wrap">
<div class="h-copy">
<div class="h-kicker rise"><span class="h-dot"></span>منصة لقراءة الهوية المعمارية السعودية</div>
<h1 class="hx rise d1">من التصميم<br><span>إلى الهوية</span></h1>
<p class="h-lead rise d2">اعرف الطراز المعماري المرتبط بموقع مشروعك، وافحص مدى توافق تصميمك مع الطرز المعمارية السعودية.</p>
<div class="h-actions rise d3">
<button class="btn h-btn h-green" @click="goRegion">اكتشف طراز منطقتك</button>
<button class="link" @click="goCheck">ابدأ فحص تصميمك</button>
</div>
</div>
<figure class="h-media">
<div class="h-back" aria-hidden="true"></div>
<div class="h-frame reveal"><img class="drift" src="assets/4f4580a5f88d82b52e3c8f7ea5f4f962.jpg" alt="كولاج لعناصر من العمارة السعودية: رواشين حجازية، وباب نجدي، ونقوش عسيرية"></div>
</figure>
</section>

<section class="h-strip" aria-label="الطرز المعمارية">
<div class="h-track">
<template v-for="(t, t_i) in strip" :key="t_i">
<button class="h-chip" @click="t.open" :style="`background: ${t.bg}; color: ${t.fg}`"><small>{{t.num}}</small>{{t.name}}</button>
</template>
</div>
</section>

<section class="h-exp">
<div class="wrap">
<div class="h-exp-head">
<div><div class="h-kicker"><span class="h-dot"></span>التجربة</div><h2 class="hx">ثلاث خطوات،<br>وقراءة واحدة.</h2></div>
<p>من رفع التصميم حتى قراءة النتيجة، في أقل من دقيقة. جرّب الخطوات لترى ما يحدث في كل مرحلة.</p>
</div>
<div class="h-walk">
<ol class="h-steps">
<template v-for="(w, w_i) in walk" :key="w_i">
<li>
<button :class="`h-step ${w.cls}`" @click="w.pick" :aria-pressed="w.on">
<span class="h-n" :style="`color: ${w.numColor}`">{{w.n}}</span>
<span class="h-st"><b>{{w.title}}</b><template v-if="w.active"><em>{{w.text}}</em></template></span>
</button>
<template v-if="w.active"><div class="h-prog"><i :class="w.anim" :style="`background: ${w.accent}`"></i></div></template>
</li>
</template>
</ol>

<div class="h-panel" :style="`background: ${wv.tint}`">
<template v-if="wv.s1">
<div class="h-pv h-pv2">
<div class="h-sheet"><img src="assets/5bc38b308904b42dd913236ece8f1041.jpg" alt=""></div>
<div class="h-file"><span class="h-ok">✓</span><div><b>فيلا-حجازية-معاصرة.jpg</b><small>تم الرفع · ٢٫٤ م.ب</small></div></div>
</div>
</template>
<template v-if="wv.s2">
<div class="h-pv h-pv3">
<div class="h-scan">
<img src="assets/5bc38b308904b42dd913236ece8f1041.jpg" alt="">
<div class="bx gold" style="left: 39.4%; top: 22.3%; width: 17%; height: 24.8%; animation-delay: .3s"><span class="bx-t">روشان</span></div>
<div class="bx" style="left: 43%; top: 53.6%; width: 7.1%; height: 22.3%; animation-delay: .9s"><span class="bx-t">باب منقوش</span></div>
<div class="bx warn" style="left: 37.3%; top: 15.2%; width: 18.5%; height: 6.4%; animation-delay: 1.5s"></div>
</div>
<ul class="h-checks">
<li><span class="h-ok">✓</span>النِّسب</li>
<li><span class="h-ok">✓</span>النوافذ والأبواب</li>
<li><span class="h-ok">✓</span>المواد والألوان</li>
<li class="now"><span class="h-spin"></span>العنصر المميّز</li>
</ul>
</div>
</template>
<template v-if="wv.s3">
<div class="h-pv h-pv4">
<div class="h-score"><b>82<small>%</small></b><span>نسبة التوافق مع الطراز الحجازي الساحلي</span></div>
<div class="h-res">
<div><h4><span class="k-ok"></span>متوافق</h4><p>الرواشين الخشبية</p><p>الأبواب المنقوشة</p><p>نسب النوافذ</p></div>
<div><h4><span class="k-rv"></span>يحتاج مراجعة</h4><p>مادة الواجهة</p><p>الشرفات المسننة</p></div>
</div>
<div class="h-note">مثال توضيحي</div>
</div>
</template>
</div>
</div>
</div>
</section>
</main>
</template>

<!-- ===================== STYLES ARCHIVE ===================== -->
<template v-if="P.styles">
<main class="page">
<section class="a-head wrap">
<div>
<div class="h-kicker rise"><span class="h-dot"></span>أرشيف الطرز</div>
<h1 class="hx rise d1">الطرز المعمارية السعودية</h1>
</div>
<p class="rise d2">تسعة عشر طرازاً وثّقتها خريطة العمارة السعودية، لكل منها مادته ولونه وعنصره المميّز. اختر منطقة، أو تصفّح الطرز مباشرة.</p>
</section>

<div class="wrap">
<div class="a-bar">
<div class="a-filters" role="tablist" aria-label="تصفية حسب المنطقة">
<template v-for="(f, f_i) in filters" :key="f_i">
<button role="tab" :class="`a-f ${f.cls}`" :aria-selected="f.on" @click="f.pick">{{f.label}}</button>
</template>
</div>
</div>
</div>

<div class="wrap">
<div class="p-head"><h2 class="hx">{{regionTitle}}</h2></div>
<div class="p-grid">
<template v-for="(s, s_i) in archive" :key="s_i">
<button class="p-card" @click="s.open" :style="`animation-delay: ${s.delay}`">
<div class="p-top"><span class="p-num" :style="`color: ${s.color}`">{{s.num}}</span><template v-if="s.ready"><span class="p-badge">متاح للفحص</span></template></div>
<div class="p-arch" :style="`background: ${s.tint}`"><img :src="s.ill" :alt="`رسم لواجهة من ${s.name}`"></div>
<h3 class="p-name">{{s.name}}</h3>
<div class="p-sub">{{s.region}}</div>
<span class="p-go">استكشف الطراز ←</span>
</button>
</template>
</div>
</div>
</main>
</template>

<!-- ===================== CHECK ===================== -->
<template v-if="P.check">
<main class="page">
<div class="wrap">
<div class="steps" aria-label="مراحل الفحص">
<template v-for="(st, st_i) in steps" :key="st_i">
<div :class="`stp ${st.cls}`" :aria-current="st.cur"><b>{{st.n}}</b>{{st.label}}</div>
</template>
</div>
</div>

<!-- STEP 1: UPLOAD -->
<template v-if="S.s1">
<div class="page">
<section class="chk-h wrap">
<div><div class="eyebrow">الخطوة ٠١</div><h1 class="disp">ارفع التصميم</h1></div>
<p>حمّل صورة التصميم المعماري، ويبدأ نُعمِّر تحليله مباشرة.</p>
</section>
<div class="up-grid wrap">
<div>
<template v-if="noUpload">
<label for="nm-file" :class="`drop ${dropCls}`" @dragover="onDragOver" @dragleave="onDragLeave" @drop="onDrop">
<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><path d="M23 32V9M14 18l9-9 9 9M8 38h30" fill="none" stroke="#68100F" stroke-width="1.8"/></svg>
<h3>اسحب التصميم وأفلته هنا</h3>
<span class="muted" style="font-size: 15px">أو <u style="color: #68100F">اختر ملفاً</u> من جهازك</span>
<span class="muted" style="font-size: 13px">صورة أو إظهار لواجهة أمامية · JPG أو PNG</span>
</label>
</template>
<template v-if="hasUpload">
<figure style="margin: 0" class="rise">
<div class="preview"><img :src="upload.src" alt="معاينة التصميم المرفوع">
<template v-if="detecting"><div class="dt-ov"><div class="an2-scan"></div><div class="dt-card"><span class="dt-spin"></span><div><b>نجهّز التصميم للفحص…</b><small>لحظات ويبدأ التحليل</small></div></div></div></template>
</div>
<figcaption class="cap"><span>{{upload.name}}</span><label for="nm-file" style="cursor: pointer; color: #68100F; text-decoration: underline">استبدال الصورة</label></figcaption>
</figure>
</template>
<input id="nm-file" type="file" accept="image/*" @change="onFile" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none">
</div>
<div style="display: flex; flex-direction: column; gap: 22px">
<div class="rule" style="padding-top: 22px">
<div style="font-size: 15px; font-weight: 600; margin-bottom: 10px">لنتيجة أوضح</div>
<ul style="margin: 0; padding: 0 18px 0 0; font-size: 15px; line-height: 2; color: #3B332C">
<li>واجهة أمامية مستوية قدر الإمكان</li>
<li>التصميم كاملاً من الأرض حتى السطح</li>
<li>ألوان المواد كما ستُنفّذ</li>
</ul>
</div>
<template v-if="noUpload">
<button class="link" @click="useSample" style="align-self: flex-start">لا يوجد لديك تصميم؟ جرّب بتصميم نموذجي</button>
</template>
</div>
</div>
</div>
</template>

<!-- STEP 3 -->
<template v-if="S.s3">
<div class="page">
<section class="an2 wrap">
<div class="an2-side">
<div class="an2-k">الخطوة ٠٢</div>
<h1 class="hx">نقرأ<br>التصميم</h1>
<ol class="an2-list">
<template v-for="(a, a_i) in anItems" :key="a_i">
<li :class="a.cls"><span class="an2-ic"><i></i></span><b>{{a.label}}</b></li>
</template>
</ol>
<div class="an2-bar"><i :style="`width: ${anPctW}`"></i></div>
<div class="an2-pct">{{anNum}}<small>%</small></div>
</div>
<div class="an2-stage">
<div class="an2-fr">
<img class="an2-img" :src="upload.src" alt="التصميم قيد الفحص">
<div class="an2-scan" aria-hidden="true"></div>
<template v-if="A.a1"><div class="bx" style="left: 6.4%; top: 15.9%; width: 76.7%; height: 60.5%"><span class="bx-t">كتلة متعددة الطوابق</span></div></template>
<template v-if="A.a2">
<div class="bx" style="left: 61%; top: 38.7%; width: 5.7%; height: 15%"><span class="bx-t">نافذة رأسية</span></div>
<div class="bx" style="left: 67.8%; top: 40.7%; width: 5.3%; height: 13%"></div>
<div class="bx" style="left: 43%; top: 53.6%; width: 7.1%; height: 22.3%"><span class="bx-t">باب خشبي منقوش</span></div>
</template>
<template v-if="A.a3">
<span class="pin" style="left: 24%; top: 34.7%; background: #E8DCC4"></span>
<span class="pin" style="left: 46.9%; top: 32.7%; background: #6E4A2E; animation-delay: .15s"></span>
<span class="pin" style="left: 69.6%; top: 32.7%; background: #EFE6D6; animation-delay: .3s"></span>
<span class="pin" style="left: 46.5%; top: 64.5%; background: #7B5436; animation-delay: .45s"></span>
</template>
<template v-if="A.a4">
<div class="bx gold" style="left: 39.4%; top: 22.3%; width: 17%; height: 24.8%"><span class="bx-t">روشان</span></div>
<div class="bx gold" style="left: 12.4%; top: 30.3%; width: 11.4%; height: 29.3%"></div>
<div class="bx warn" style="left: 37.3%; top: 15.2%; width: 18.5%; height: 6.4%"><span class="bx-t">شرفات مسننة</span></div>
</template>
</div>
</div>
</section>
</div>
</template>

<!-- STEP 4 RESULT -->
<template v-if="S.s4">
<div class="page">
<section class="r-hero wrap">
<div class="r-band">
<div class="r-score">
<span class="r-lbl">نسبة التوافق</span>
<div class="r-num">{{pct}}<small>%</small></div>
<span class="r-with">مع {{ck.name}}</span>
</div>
<div class="r-thumb"><img :src="upload.src" alt="التصميم المفحوص"></div>
<span class="r-tag">نتيجة تجريبية لأغراض عرض النموذج الأولي</span>
</div>
</section>

<section class="r-cards wrap">
<template v-for="(w, w_i) in weights" :key="w_i">
<div class="r-card" :style="`animation-delay: ${w.delay}`">
<div class="r-card-t"><span>{{w.n}}</span><b>{{w.label}}</b></div>
<div class="r-card-v">{{w.score}}</div>
<div class="r-seg"><template v-for="(g, g_i) in w.segs" :key="g_i"><i :class="g.cls" :style="`transition-delay: ${g.d}`"></i></template></div>
</div>
</template>
</section>

<section class="r-lists wrap">
<div class="r-box ok">
<div class="r-box-k">قراءة إيجابية</div>
<h2 class="hx">عناصر متوافقة</h2>
<ul>
<template v-for="(c, c_i) in okItems" :key="c_i">
<li><span class="r-mk">✓</span><div><b>{{c.name}}</b></div></li>
</template>
</ul>
</div>
<div class="r-box rv">
<div class="r-box-k">فرص تطوير</div>
<h2 class="hx">عناصر تحتاج مراجعة</h2>
<ul>
<template v-for="(c, c_i) in rvItems" :key="c_i">
<li><span class="r-mk">!</span><div><b>{{c.name}}</b></div></li>
</template>
</ul>
</div>
</section>

<section class="r-foot wrap">
<div class="r-foot-a">
<button class="btn" @click="again">فحص تصميم آخر</button>
<button class="btn ghost" @click="openCk">استكشف الطراز</button>
</div>
</section>
</div>
</template>
</main>
</template>

<!-- ===================== REGION ===================== -->
<template v-if="P.region">
<main class="page">
<section class="dx wrap">
<div class="dx-info">
<template v-if="rg.none">
<div class="dx-k rise"><span class="dx-ai"></span>اكتشف طراز منطقتك</div>
<h1 class="hx rg-q rise d1">أين يقع مشروعك؟</h1>
<p class="rg-sub rise d2">اختر المدينة أو المنطقة، ونعرّفك بالطراز المعماري المرتبط بها.</p>
<div class="rg-search rise d2">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="#62584D" stroke-width="1.6"/><path d="M12.5 12.5L17 17" stroke="#62584D" stroke-width="1.6"/></svg>
<input type="text" placeholder="ابحث عن مدينة، مثل: مكة المكرمة" :value="rg.q" @input="onQ" aria-label="ابحث عن مدينة أو منطقة">
<template v-if="rg.hasQ">
<div class="rg-sug" role="listbox">
<template v-for="(c, c_i) in rg.sug" :key="c_i">
<button role="option" @click="c.pick"><span>{{c.city}}</span><small>{{c.area}}</small></button>
</template>
<template v-if="rg.empty"><div class="rg-none">لا توجد نتائج مطابقة. جرّب اسم مدينة أخرى.</div></template>
</div>
</template>
</div>
<template v-if="rg.noQ">
<div class="rg-chips-l rise d3">مدن مقترحة</div>
<div class="rg-chips rise d3">
<template v-for="(c, c_i) in rg.pop" :key="c_i">
<button class="rg-chip" @click="c.pick">{{c.city}}</button>
</template>
</div>
</template>
</template>
<template v-if="rg.has">
<div class="rg-loc rise"><span>موقع المشروع:</span><b>{{rg.city}}</b></div>
<div class="dx-k rise"><span class="dx-ai"></span>طراز منطقتك</div>
<h1 class="hx rise d1">{{rs.name}}</h1>
<div class="dx-reg rise d1"><span class="h-dot" :style="`background: ${rs.color}`"></span>{{rs.region}}</div>
<p class="rise d2">{{rs.desc}}</p>
<div class="dx-act rise d3">
<button class="btn" @click="openRs">تفاصيل الطراز</button>
<button class="link" @click="rgReset">اختر موقعاً آخر</button>
</div>
</template>
</div>
<div class="dx-map rise d2">
<div class="dx-mh"><b>خريطة العمارة السعودية</b><span>١٩ طرازاً معمارياً</span></div>
<div class="dx-in">
<img :src="rg.map" alt="خريطة العمارة السعودية" class="dx-img">
<template v-if="rg.has"><div :class="`dx-label ${rg.flip}`" :style="rg.lpos"><small>{{rg.city}}</small><b>{{rs.name}}</b></div></template>
</div>
<p class="dx-note">{{rg.note}} المصدر: خريطة العمارة السعودية.</p>
</div>
</section>
</main>
</template>

<!-- ===================== ABOUT ===================== -->
<template v-if="P.about">
<main class="page ab3">
<section class="ab3-hero wrap">
<div class="h-kicker rise" style="justify-content: center"><span class="h-dot"></span>عن نُعمِّر</div>
<h1 class="hx rise d1">نربط تصميمك<br><span>بهوية المكان.</span></h1>
<p class="rise d2">لكل منطقة في المملكة طرازٌ يحكي مناخها وموادها وحكاية أهلها. نُعمِّر يرافقك من أول فكرة إلى آخر لمسة: تكتشف طراز موقع مشروعك قبل أن تبدأ، وتفحص تصميمك بالذكاء الاصطناعي حين تنتهي، لتعرف ما يعبّر عن الهوية وما يحتاج مراجعة، استناداً إلى تسعة عشر طرازاً وثّقتها خريطة العمارة السعودية.</p>
</section>

<section class="ab3-band" aria-hidden="true">
